{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Ualikhanov University</title>
  <link rel="icon" type="image/png" href="{% static 'dashboard/logo.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/app.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <form method="post" class="login-card">
    {% csrf_token %}
    {% include "dashboard/_logo.html" with size="lg" %}
    <p>Панель консультанта: база знаний и вопросы Telegram-бота.</p>
    {% if form.errors %}
      <div class="flash error">Неверный логин или пароль.</div>
    {% endif %}
    <label>Логин
      <input type="text" name="username" autofocus required>
    </label>
    <label>Пароль
      <input type="password" name="password" required>
    </label>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
